pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      tags: [security]
      skip:
        - run: "! command -v gitleaks"
      run: gitleaks git --staged --verbose

    - name: flutter
      root: code/flutter/
      glob: "*.dart"
      group:
        parallel: false
        jobs:
          - name: dart format
            run: dart format {staged_files}
            stage_fixed: true
          - name: flutter analyze
            run: flutter analyze

    - name: api
      root: code/api/
      glob: "*.go"
      group:
        parallel: false
        jobs:
          - name: gofmt
            run: gofmt -w {staged_files}
            stage_fixed: true
          - name: golangci-lint
            run: golangci-lint run
