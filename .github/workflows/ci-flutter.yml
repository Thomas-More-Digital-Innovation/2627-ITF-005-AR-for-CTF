name: Flutter CI Pipeline

on:
  push:
    branches: [main]
    paths: &paths
      - "code/flutter/**"
      - ".github/workflows/ci-flutter.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/security.yml"
      - "!**.md"
  pull_request:
    branches: ["**"]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: dotactions/flutter/.github/workflows/ci.yml@3290bcaf8b46e39b7f3126778f3ca23bec7adb16 # v0.1.0
    with:
      working-directory: code/flutter
      pr-targets: '["android-apk"]'
      push-targets: '["android-aab"]'

      pr-build-mode: "debug"
      push-build-mode: "release"
