name: Security Audit

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "0 4 * * 4" # weekly Thursday at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    uses: dotsem/actions/.github/workflows/trivy-audit.yml@6e0528a9cf09ccd0879687a4989a1492e371d5b1 #v0.5.2
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: write
      actions: read
    with:
      severity: "CRITICAL,HIGH"
      fail-on-findings: true

      manage-issue: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
