name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: dotsem/actions/.github/workflows/flutter-ci.yml@6e0528a9cf09ccd0879687a4989a1492e371d5b1 #v0.5.2
    with:
      working-directory: code/flutter
      pr-targets: '["android-apk"]'
      push-targets: '["android-aab"]'

      pr-build-mode: "debug"
      push-build-mode: "release"
