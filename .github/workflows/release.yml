name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cd:
    uses: dotsem/actions/.github/workflows/flutter-cd.yml@73b100bd41fb2bdb3e03366f4e7c5d5534866e5c
    permissions:
      contents: write
    with:
      working-directory: code/flutter
      targets: '["android-apk", "android-aab"]'
      tag: ${{ inputs.tag || github.event.release.tag_name }}
